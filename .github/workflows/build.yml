name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fragenkatalog und Bewertung testen
        run: node tools/test_grader.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk NotarztDrill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotarztDrill-apk
          path: NotarztDrill.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NotarztDrill ${{ github.run_number }}
          body: Automatischer Build aus ${{ github.sha }}
          files: NotarztDrill.apk
          make_latest: true
